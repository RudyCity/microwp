name: microWP
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - name: Fetch pinned official sources
        run: bun run sources:fetch
      - name: Package WordPress code and assets
        run: bun run wordpress:prepare
      - name: Prepare Worker-compatible PHP WebAssembly loader
        run: bun run wasm:prepare
      - name: Unit tests and types
        run: bun run check
      - name: Edge Worker bundle
        run: bun run build
      - name: Native WordPress bundle
        run: bun run native:build
      - name: Durable WordPress bundle
        run: bun run durable:build
      - name: Staging bundle with D1 and R2 bindings (dry-run only)
        run: bun run staging:build
      - name: Private D1 transactional autoload with real local Workerd D1
        run: bun run d1:atomic-e2e
      - name: Real WordPress E2E in Cloudflare workerd
        run: bash scripts/e2e-local.sh
      - name: Free Durable Object WordPress canary bundle (dry-run only)
        run: bun run canary:build
      - name: WordPress PHP executes in a local Durable Object (private canary)
        run: bun run canary:e2e
      - name: Dedicated Redis-like Worker cache bundle (dry-run only)
        run: bun run worker-cache:build
      - name: Service Binding and Redis-like cache E2E in two local Workers
        run: bun run worker-cache:e2e
      - name: Opt-in WordPress object-cache drop-in bundle (dry-run only)
        run: bun run wp-object-cache:build
      - name: Real PHP-WASM WordPress cache group invalidation in local DO
        run: bun run wp-object-cache:e2e
      - name: WordPress cache editorial with D1 R2 and Service Binding (dry-run bundle)
        run: bun run wp-cache:editorial-build
      - name: WordPress editorial, Transients API and cache invalidation E2E
        run: bun run wp-cache:editorial-e2e
      - name: WordPress cache Service Binding failure and recovery E2E
        run: bun run wp-cache:resilience-e2e
